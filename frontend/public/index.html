<!doctype html>
<html lang="tr">
    <head>
        <!-- Google Tag Manager -->
        
        <!-- End Google Tag Manager -->
        <!-- Google Tag Manager (PWQH4P45) -->
        
        <!-- End Google Tag Manager (PWQH4P45) -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!-- LCP görseli ve diğer tüm ürün görselleri bu CDN'den gelir → bağlantıyı
             erkenden kur (preconnect), ilk görsel daha hızlı boyansın. -->
        <link rel="preconnect" href="https://cdn.estoril.com.tr" crossorigin />
        <link rel="dns-prefetch" href="https://cdn.estoril.com.tr" />
        <!-- [perf 2026-06-22] API host: homepage urun + page-blocks fetch'i buradan gelir
             (client-render SPA'da kritik yol). Baglanti onceden isinsin -> icerik daha hizli. -->
        <link rel="preconnect" href="https://api.estoril.com.tr" crossorigin />
        <link rel="dns-prefetch" href="https://api.estoril.com.tr" />
        <!-- Analitik/piksel host'ları için dns-prefetch (bağlantı ısınması) -->
        <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
        <noscript><link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <title>Estoril Cosmetic — Yönetim</title>

        <!-- ===== Favicon / App ikonları ===== -->
        <link rel="icon" href="/favicon.ico" sizes="any" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/site.webmanifest" />

        <!-- ===== SEO (ana sayfa varsayılanları; ürün/kategori sayfaları react-helmet ile ezer) ===== -->
        <meta name="description" content="ESTORIL — kadın modasında yeni sezon koleksiyonu. Zamansız elbise, pantolon, ceket ve aksesuar parçaları. Hızlı kargo, güvenli ödeme, kolay iade." />
        <meta name="robots" content="index, follow, max-image-preview:large" />
        <link rel="canonical" href="https://estoril.com.tr/" />

        <!-- Open Graph (WhatsApp / Facebook / LinkedIn paylaşım kartı) -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="ESTORIL" />
        <meta property="og:locale" content="tr_TR" />
        <meta property="og:title" content="ESTORIL | Yeni Sezon Kadın Giyim & Moda" />
        <meta property="og:description" content="Kadın modasında yeni sezon koleksiyonu: zamansız parçalar, elbise, pantolon, ceket, aksesuar." />
        <meta property="og:url" content="https://estoril.com.tr/" />
        <meta property="og:image" content="https://estoril.com.tr/og-image.jpg" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />

        <!-- Twitter / X kartı -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="ESTORIL | Yeni Sezon Kadın Giyim & Moda" />
        <meta name="twitter:description" content="Kadın modasında yeni sezon koleksiyonu: zamansız parçalar, elbise, pantolon, ceket, aksesuar." />
        <meta name="twitter:image" content="https://estoril.com.tr/og-image.jpg" />

        <!-- Yapısal veri: Organization + WebSite (Google sitelinks arama kutusu) -->
        <script type="application/ld+json">
        {"@context":"https://schema.org","@type":"Organization","name":"ESTORIL","url":"https://estoril.com.tr/","logo":"https://estoril.com.tr/logo.png"}
        </script>
        <script type="application/ld+json">
        {"@context":"https://schema.org","@type":"WebSite","name":"ESTORIL","url":"https://estoril.com.tr/","potentialAction":{"@type":"SearchAction","target":{"@type":"EntryPoint","urlTemplate":"https://estoril.com.tr/arama?q={search_term_string}"},"query-input":"required name=search_term_string"}}
        </script>

        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
    </head>
